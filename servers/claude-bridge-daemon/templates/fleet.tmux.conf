# The fleet's tmux server: a lock against the hand, not against intent.
#
# WHY THIS FILE EXISTS. Every peer lives in a tmux pane a human can type into.
# That is the point — the owner requires it in as many words: "I need to be able
# to decide at any moment that I want to tell a peer something, and tell it."
# What he does not want is that the same keyboard can, by one mistyped prefix,
# split the pane, open a window, or drop into a command prompt that reaches the
# whole server.
#
# WHAT IT DOES AND DOES NOT PROMISE (his words: "reliable against a slip; not
# against intent — that is perfectly fine"). Anybody who wants to can still run
# `tmux -L fleet kill-server` from a shell. This file removes the accidents.
#
# ── The two measurements this file rests on (2026-08-16, real pty client) ──
#
#   `select-pane -d` DOES NOT protect a pane. It discards keyboard AND send-keys
#   input, but the prefix never enters the pane at all — it goes to the tmux
#   CLIENT. A pane locked that way still split on `Ctrl-B %`. Measured, after I
#   had claimed the opposite.
#
#   `unbind -a` in all FOUR key tables does. With the tables emptied, `Ctrl-B %`,
#   `Ctrl-B c` and `Ctrl-B :` followed by `kill-server` all did nothing and the
#   server was still alive afterwards.
#
# ── Why the fleet needs its own socket ────────────────────────────────────────
#
# KEY BINDINGS ARE SERVER-SCOPED, not session- or window-scoped. Applying this
# to the default server would take the shortcuts away from the owner's own
# sessions and from `tst-c` as well. Hence `-L fleet`: the lock covers exactly
# the peers and nothing else.
#
# ── Copy-mode is IN, by the owner's decision (2026-08-16) ─────────────────────
#
# Scrollback is the first place anyone reaches in a problem, so `[` stays bound.
# That decision made one thing worth measuring rather than assuming: the copy
# tables carry 16 bindings of the shape
#   command-prompt -N -I <n> -p (repeat) { send-keys -N "%%" }
# which are the ONLY bindings there that call something other than `send-keys -X`.
# A command prompt inside a locked mode looks exactly like a way out. It is not:
# with `-N` it takes a number, and typing `kill-server` into it left the server
# running (measured). The rebound copy-mode set below is nevertheless restricted
# to `send-keys -X`, so the question cannot come back through a future default.

# ── Layout options the control plane depends on ──────────────────────────────
# `renumber-windows on` is why a restart cannot recreate a window at its old
# index — killing one shifts every window after it, so a create can only append.
# `peer_restart` measures the index before the kill and `move-window -b` puts the
# peer back (#103). Both options are stated here so the fleet server never
# inherits a different answer from someone's ~/.tmux.conf.
set -g base-index 1
set -g renumber-windows on

# The default (100000 lines) is where 936 MB of the production server's RSS came
# from. The driver sets this per session before creating a window; stated here so
# a session created by hand does not get the inherited value.
set -g history-limit 2000

# ── The lock ─────────────────────────────────────────────────────────────────
# All four tables, because a binding removed from `prefix` alone still answers
# from `root`, and the copy tables are live whenever a pane is in a mode.
unbind -a -T prefix
unbind -a -T root
unbind -a -T copy-mode
unbind -a -T copy-mode-vi

# ── What a human may still do ────────────────────────────────────────────────
# Detach: without it a client that opened the session by hand cannot leave it
# except by killing the terminal.
bind-key -T prefix d detach-client

# Move between peers. This is navigation only — none of it creates, destroys or
# reshapes anything.
bind-key -T prefix n next-window
bind-key -T prefix p previous-window
bind-key -T prefix 1 select-window -t :1
bind-key -T prefix 2 select-window -t :2
bind-key -T prefix 3 select-window -t :3
bind-key -T prefix 4 select-window -t :4
bind-key -T prefix 5 select-window -t :5
bind-key -T prefix 6 select-window -t :6
bind-key -T prefix 7 select-window -t :7
bind-key -T prefix 8 select-window -t :8
bind-key -T prefix 9 select-window -t :9

# Scrollback (the owner's decision above).
bind-key -T prefix [ copy-mode

# Inside copy-mode: movement and exit, and NOTHING that is not `send-keys -X`.
# `send-keys -X` cannot leave the mode's own vocabulary, which is the property
# that makes this set safe to state without re-auditing it after every tmux
# release.
bind-key -T copy-mode Up       send-keys -X cursor-up
bind-key -T copy-mode Down     send-keys -X cursor-down
bind-key -T copy-mode PageUp   send-keys -X page-up
bind-key -T copy-mode PageDown send-keys -X page-down
bind-key -T copy-mode Home     send-keys -X history-top
bind-key -T copy-mode End      send-keys -X history-bottom
bind-key -T copy-mode q        send-keys -X cancel
bind-key -T copy-mode Escape   send-keys -X cancel

# ── Applying this to the running fleet is NOT this file's job ────────────────
# Ownership (ratified, plan-rizeny-tmux.md): design and code = bridge-dev,
# anything applied to a production tmux = kb-ops, GO = the owner.
#
# And the rule that goes with it: generate the undo FROM THE LIVE STATE
# (`list-keys`, `show-options`, `show-hooks`) BEFORE applying, and verify the
# return by comparing bytes — not by re-running this file in reverse.
